<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handyman Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1d1f;--mu:#6b6e73;--ac:#d9620b;--ln:#e4e2db;--ok:#1f8a4c;--bad:#c23b2e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#ececea;--mu:#9a9da2;--ac:#f08a3c;--ln:#34373a;--ok:#4cc17f;--bad:#ef7a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#ececea;--mu:#9a9da2;--ac:#f08a3c;--ln:#34373a;--ok:#4cc17f;--bad:#ef7a6e;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.row .t{font-weight:600}.row .s{color:var(--mu);font-size:13px}
.id{font:12px ui-monospace,Menlo,monospace;color:var(--mu);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:1px 6px;white-space:nowrap}
.pill{font-size:12px;border-radius:99px;padding:1px 8px;border:1px solid var(--ln);color:var(--mu)}
.pill.good{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--bad);border-color:var(--bad)}
button{font:inherit;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:9px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button.d{color:var(--bad)}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar input{flex:1}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;white-space:nowrap;color:var(--mu);padding:8px 12px}nav button.on{color:var(--ac);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--ln)}.kv:last-child{border:0}.kv span:first-child{color:var(--mu)}.kv span:last-child{text-align:right}
a.l{color:var(--ac);cursor:pointer;text-decoration:underline}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.note{color:var(--mu);font-size:13px}
#pv{position:fixed;inset:0;background:#777;z-index:30;display:none;overflow:auto}
#pv .pb{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--card);display:flex;gap:8px;z-index:31}
.dp{position:relative;width:794px;height:1123px;background:#fff;color:#4f4f5e;font:14px/1.5 Montserrat,system-ui,sans-serif;overflow:hidden}.dp *{box-sizing:border-box}
.dp .band{height:40px;background:#dcdfea}.dp .ttl{position:absolute;left:54px;top:78px;font-size:62px;font-weight:800;line-height:1}
.dp .meta{position:absolute;left:54px;top:168px;line-height:26px}.dp .lg{position:absolute;left:478px;top:54px;width:215px}
.dp hr{position:absolute;left:0;right:0;border:0;border-top:1px solid #4f4f5e;margin:0}
.dp .bt{position:absolute;left:54px;top:286px;line-height:21px;font-size:13px}.dp .sb{left:483px}
.dp .flow{position:absolute;left:40px;top:461px;width:692px}.dp table{border-collapse:collapse;width:100%}
.dp th{background:#4f4f5e;color:#fff;font-weight:500;padding:13px 6px;border:1px solid #fff}
.dp td{border:1px solid #4f4f5e;padding:7px 8px;text-align:center;background:#fff}.dp td:first-child{text-align:left}
.dp .pay{display:flex;justify-content:space-between;margin-top:46px;line-height:26px}.dp .tt{width:280px}
.dp .tt td:first-child{background:#4f4f5e;color:#fff;border-color:#fff}
.dp .ft{position:absolute;left:0;right:0;bottom:0;height:58px;background:#4f4f5e;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:0 10px 0 54px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.cd{min-height:54px;border:1px solid var(--ln);border-radius:8px;padding:3px 5px;background:var(--card);font-size:13px;cursor:pointer}.ci{font-size:11px;line-height:1.2}
</style></head><body>
<div id="sb"></div>
<main id="app"><p class="note">Loading…</p></main>
<nav id="nav"></nav>
<input type="file" id="fi" accept="image/*" multiple style="display:none" onchange="fiPick(this)">
<div id="modal"><div id="mbody"></div></div>
<div id="pv"><div class="pb"><button class="p" onclick="pdfSave()">Save PDF</button><button onclick="closePv()">Close</button></div><div id="pvs"></div></div>
<script>
const SEL={status:'New,Contacted,Quoted,Won,Lost'};
const S={
customers:{p:'C',label:'Customer',plural:'Customers',title:r=>r.name,fields:[['name','Name','text'],['phone','Phone','tel'],['email','Email','email'],['address','Billing address','text'],['site','Site address (if different)','text'],['abn','ABN (if a business)','text'],['pref','Contact preference','sel:SMS,Email,Phone'],['access','Access notes (pets, keys)','text'],['notes','Notes and other contacts','area']]},
jobs:{p:'J',label:'Job',plural:'Jobs',title:r=>r.title,fields:[['quoteId','From quote','ref:quotes'],['customerId','Customer','ref:customers',1],['title','Job','text'],['status','Status','sel:Scheduled,In progress,Ongoing,Complete,Invoiced'],['rate','Hourly rate ($)','number'],['date','Scheduled date','date']]},
leads:{p:'L',label:'Lead',plural:'Leads',title:r=>r.title,fields:[['customerId','Customer','ref:customers'],['title','Job wanted','text'],['source','Source','sel:Referral,Web,Facebook,Signage,Other'],['status','Status','sel:New,Contacted,Quoted,Won,Lost'],['date','Date','date']]},
quotes:{p:'Q',label:'Quote',plural:'Quotes',title:r=>r.number||r.title,fields:[['number','Number','text'],['customerId','Customer','ref:customers',1],['leadId','Lead','ref:leads'],['amount','Total (incl. GST)','number'],['status','Status','sel:Draft,Sent,Accepted,Declined'],['date','Date','date'],['valid','Valid until','date']]},
invoices:{p:'I',label:'Invoice',plural:'Invoices',title:r=>r.number||r.title,fields:[['number','Number','text'],['customerId','Customer','ref:customers',1],['jobId','Job','ref:jobs'],['amount','Total (incl. GST)','number'],['status','Status','sel:Unpaid,Paid'],['date','Issued','date'],['due','Due','date']]},
time:{p:'T',label:'Time entry',plural:'Time',title:r=>r.hours+' hr: '+(r.note||''),fields:[['jobId','Job','ref:jobs'],['hours','Hours','number'],['note','What was done','text'],['date','Date','date']]},
expenses:{p:'E',label:'Expense',plural:'Expenses',title:r=>r.title,fields:[['jobId','Job (blank = general)','ref:jobs'],['title','Item','text'],['supplier','Supplier','text'],['amount','Amount ($)','number'],['gst','GST included in amount?','sel:Yes,No'],['category','Category','sel:Materials,Fuel,Vehicle,Tools,Subcontractor,Insurance,Phone and internet,Advertising,Other'],['date','Date','date']]},
comms:{p:'M',label:'Communication',plural:'Comms',title:r=>(r.type||'Note')+': '+String(r.note||'').slice(0,40),fields:[['customerId','Customer','ref:customers'],['type','Type','sel:Quote sent,Invoice sent,Message sent,Email sent,Phone call,Message received,Email received,Call received,Site visit'],['quoteId','Quote','ref:quotes'],['invoiceId','Invoice','ref:invoices'],['note','Comment','area'],['date','Date','date'],['followUp','Follow up by','date']]},
catalog:{p:'K',label:'Catalog item',plural:'Catalog',title:r=>r.name,fields:[['name','Name','text'],['kind','Type','sel:Labour,Materials,Other'],['unit','Unit','sel:Hr,ea,m,m²,load,job'],['cost','Cost each ($ ex GST), materials','number'],['rate','Price each ($), or leave cost for materials','number']]},
tasks:{p:'X',label:'Task',plural:'Tasks',title:r=>r.title,fields:[['title','Task','text'],['due','Due','date'],['status','Status','sel:Open,Done'],['customerId','Customer','ref:customers'],['about','Linked record','text',1]]},
meta:{p:'Z',label:'Setting',plural:'Meta',title:r=>'Schema',fields:[]},
trips:{p:'G',label:'Trip',plural:'Trips',title:r=>(r.km||0)+' km · '+(r.purpose||'Trip'),fields:[['jobId','Job (optional)','ref:jobs'],['odoStart','Odometer start','number'],['odoEnd','Odometer end','number'],['km','Distance (km), or leave blank to use the odometer','number'],['purpose','Purpose','sel:Job travel,Supplies run,Quote visit,Other business'],['from','From','text'],['to','To','text'],['date','Date','date'],['note','Note','text']]},
days:{p:'D',label:'Day',plural:'Days',title:r=>'End of day '+(r.date||''),fields:[['date','Date','date'],['notes','Day notes','area'],['noTravel','No travel today','sel:No,Yes'],['closed','Day closed','sel:No,Yes']]},
visits:{p:'V',label:'Visit',plural:'Visits',title:r=>(r.kind||'Visit')+' '+(r.date||''),fields:[['leadId','Lead (quote visit)','ref:leads'],['jobId','Job (work visit)','ref:jobs'],['kind','Type','text',1],['date','Date','date'],['time','Start time','time'],['status','Status','sel:Scheduled,Done,Cancelled'],['note','Note','text']]},
payments:{p:'Y',label:'Payment',plural:'Payments',title:r=>money(r.amount)+' '+(r.method||''),fields:[['invoiceId','Invoice','ref:invoices'],['amount','Amount ($)','number'],['method','Method','sel:Bank transfer,Cash,Card,Other'],['date','Date','date'],['note','Note','text']]},
reviews:{p:'R',label:'Review',plural:'Reviews',title:r=>(r.rating?r.rating+'★ ':'')+(D.jobs[r.jobId]?.title||'Review'),fields:[['jobId','Job','ref:jobs'],['status','Status','sel:Requested,Received,No response,Declined'],['platform','Platform','sel:Google,Facebook,Word of mouth,Other'],['rating','Rating','sel:5,4,3,2,1'],['text','What they said','area'],['canQuote','OK to quote publicly?','sel:Yes,No'],['date','Date','date']]},
photos:{p:'H',label:'Photo',plural:'Photos',title:r=>r.kind+(r.caption?': '+r.caption:''),fields:[['jobId','Job','ref:jobs'],['expenseId','Expense','ref:expenses'],['kind','Type','sel:Receipt,Before,After,Progress,Other'],['caption','Caption','text'],['date','Date','date'],['assetId','File','text',1]]},
showcase:{p:'P',label:'Showcase item',plural:'Showcase',title:r=>D.jobs[r.jobId]?.title||'Showcase item',fields:[['jobId','Job','ref:jobs'],['status','Status','sel:Candidate,Permission asked,Approved,Scheduled,Posted,Not for posting'],['permission','Customer permission','sel:Not asked,Asked,Granted,Declined'],['channel','Channel','sel:Facebook,Instagram,Website,Google Business,Multiple'],['photos','Photos','sel:None yet,Before only,Before and after'],['caption','Caption / notes','area'],['date','Post date','date']]}
};
const COLS=['tasks','customers','leads','quotes','jobs','invoices','time','expenses','comms','showcase','reviews','catalog','photos','visits','payments','trips','days','meta'],D={};COLS.forEach(c=>D[c]={});
let db=null,view={tab:'home'},stack=[],loaded=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(+n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=(o=0)=>{const d=new Date();d.setDate(d.getDate()+o);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const sum=(c,f=()=>true)=>Object.values(D[c]).filter(f).reduce((a,r)=>a+(+r.amount||0),0);
const nm=(c,id)=>D[c][id]?S[c].title(D[c][id]):'(missing '+id+')';
const pill=s=>{const g=['Paid','Won','Accepted','Posted','Approved','Complete','Done','Received'].includes(s),w=['Overdue','Lost','Declined','Not for posting','Cancelled','No response'].includes(s);return s?`<span class="pill ${g?'good':w?'warn':''}">${esc(s)}</span>`:''};
function nextId(c){const n=Object.keys(D[c]).map(k=>parseInt(k.split('-')[1])||0);return S[c].p+'-'+String(Math.max(0,...n)+1).padStart(4,'0')}
function go(v){stack.push(view);view=v;render();scrollTo(0,0)}
function back(){view=stack.pop()||{tab:'home'};render()}
function tab(t){stack=[];view={tab:t};render();scrollTo(0,0)}

function rowHtml(c,id){if(c==='invoices')return invRow(id);const r=D[c][id],bits=[];
 if(c!=='customers'&&r.customerId)bits.push(esc(nm('customers',r.customerId)));
 if(r.amount!=null&&r.amount!=='')bits.push(money(r.amount));
 if(r.jobId&&!r.customerId&&D.jobs[r.jobId]&&c!=='showcase')bits.push(esc(nm('jobs',r.jobId)));if(r.hours!=null)bits.push(r.hours+' hr');if(r.channel)bits.push(esc(r.channel));if(r.leadId&&c==='visits'&&D.leads[r.leadId])bits.push(esc(nm('leads',r.leadId)));if(r.time)bits.push(r.time);if(r.invoiceId&&(c==='time'||c==='expenses'))bits.push('Billed');if(c==='expenses'&&Object.values(D.photos).some(p=>p.expenseId===id))bits.push('📎');if(c==='quotes')bits.push(sent('quotes',id)?'Sent '+sent('quotes',id):'Not sent');if(r.date)bits.push(r.date);
 return `<div class="row" onclick='go({c:"${c}",id:"${id}"})'><div><div class="t">${esc(S[c].title(r))}</div><div class="s">${bits.join(' · ')}</div></div><div style="text-align:right"><div class="id">${id}</div>${pill(r.status)}</div></div>`}
const sorted=c=>Object.keys(D[c]).sort((a,b)=>c==='customers'?S[c].title(D[c][a]).localeCompare(S[c].title(D[c][b])):b.localeCompare(a));

function render(){
 $('#nav').innerHTML=['home','wrap','calendar','finance',...COLS.filter(c=>!['photos','visits','payments','trips','days','meta'].includes(c))].map(t=>`<button class="${(view.tab===t||view.c===t)?'on':''}" onclick="${t==='wrap'?'WRAP.d=today();':''}tab('${t}')">${t==='home'?'Home':t==='wrap'?'End of day':t==='calendar'?'Calendar':t==='finance'?'Finance':S[t].plural+(t==='tasks'&&loaded>=COLS.length&&nTasks()?' ('+nTasks()+')':'')}</button>`).join('');
 const a=$('#app');$('#sb').innerHTML=schemaMsg();
 if(!db){a.innerHTML='<h1>Handyman Manager</h1><div class="card">Saving needs the database connection. Open this page signed in to claude.ai to read and write data.</div>';return}
 if(loaded<COLS.length){a.innerHTML='<p class="note">Loading…</p>';return}
 if(view.id)return detail(a);
 if(view.tab==='wrap')return wrapPage(a);if(view.tab==='calendar')return calPage(a);if(view.tab==='finance')return finPage(a);if(view.tab==='tasks')return tasksPage(a);
 if(view.tab==='home')return home(a);
 list(a,view.tab);
}
function home(a){
 const out=sum('invoices',r=>r.status!=='Paid'),paid=sum('invoices',r=>r.status==='Paid'),exp=sum('expenses'),leads=Object.values(D.leads).filter(r=>!['Won','Lost'].includes(r.status)).length;
 const empty=COLS.every(c=>c==='meta'||!Object.keys(D[c]).length);
 let h=`<h1>Handyman Manager</h1><div class="grid">
 <div class="card stat"><b>${money(out)}</b><span>Owed to you</span></div>
 <div class="card stat"><b>${money(paid)}</b><span>Paid invoices</span></div>
 <div class="card stat"><b>${money(exp)}</b><span>Expenses</span></div>
 <div class="card stat"><b>${money(paid-exp)}</b><span>Paid minus expenses</span></div>
 <div class="card stat"><b>${leads}</b><span>Open leads</span></div>
 <div class="card stat"><b>${Object.keys(D.customers).length}</b><span>Customers</span></div><div class="card stat" onclick="tab('tasks')" style="cursor:pointer"><b>${nTasks()}</b><span>Tasks and flags</span></div></div>`;
 h+='<h2>Today</h2>'+(evs().filter(e=>e.d===today()).sort((a,b)=>(a.tm||'').localeCompare(b.tm||'')).map(evRow).join('')||'<p class="note">Nothing scheduled today.</p>')+'<p class="bar"><button class="p" onclick="WRAP.d=today();tab(\'wrap\')">🌙 End of day</button></p>';
 if(empty)h+=`<h2>Get started</h2><div class="card"><p>Your database is empty. Load a small set of linked demo records to explore, or start adding your own.</p>${LIVE?'':'<button class="p" onclick="seed()">Load demo data</button>'}</div>`;
 else{h+=`<h2>Recent communications</h2>`+sorted('comms').slice(0,4).map(i=>rowHtml('comms',i)).join('')
  +`<h2>Unpaid invoices</h2>`+(sorted('invoices').filter(i=>D.invoices[i].status!=='Paid').map(i=>rowHtml('invoices',i)).join('')||'<p class="note">None. Nice.</p>')
  +`<p style="margin-top:24px">${LIVE?'':'<button class="d" onclick="wipe()">Delete all data</button>'}</p>`}
 a.innerHTML=h}
const NOADD={quotes:'Create quotes from a lead',jobs:'Create jobs from an accepted quote',invoices:'Create invoices from a job',showcase:'Add items from a completed job',reviews:'Request reviews from a completed job'};
function list(a,c){
 a.innerHTML=`<h1>${S[c].plural}</h1><div class="bar"><input id="q" placeholder="Search…" oninput="filt()">${c==='invoices'?'<select id="flt" style="width:auto" onchange="filt()"><option>All</option><option>Unpaid</option><option>Overdue</option><option>Not sent</option><option>Paid</option></select>':''}${NOADD[c]?'':`<button class="p" onclick="openForm('${c}')">+ New</button>`}</div>${NOADD[c]?`<p class="note">${NOADD[c]}.</p>`:''}<p class="note" id="sm"></p><div id="lst"></div>`;filt()}
function filt(){const c=view.tab,q=($('#q')?.value||'').toLowerCase(),f=$('#flt')?.value;
 const ok=i=>{const r=D[c][i];if(c!=='invoices')return 1;return f==='Unpaid'?r.status!=='Paid':f==='Overdue'?isOd(r):f==='Not sent'?!sent('invoices',i):f==='Paid'?r.status==='Paid':1};
 const ids=sorted(c).filter(i=>ok(i)&&(!q||JSON.stringify(D[c][i]).toLowerCase().includes(q)||i.toLowerCase().includes(q)));
 $('#sm').textContent=c==='invoices'?ids.length+' invoices · '+money(ids.reduce((a,i)=>a+(+D.invoices[i].amount||0),0)):'';
 $('#lst').innerHTML=ids.map(i=>rowHtml(c,i)).join('')||'<p class="note">Nothing here yet.</p>'}
function links(c,id){const o=[];for(const oc of COLS)for(const [k,l,t] of S[oc].fields)if(t==='ref:'+c)o.push({oc,k,l,ids:sorted(oc).filter(i=>D[oc][i][k]===id)});return o}
function detail(a){
 const {c,id}=view,r=D[c][id];
 if(!r){a.innerHTML='<p class="note">Record not found.</p><button onclick="back()">‹ Back</button>';return}
 let h=`<p><button onclick="back()">‹ Back</button></p><h1>${esc(S[c].title(r))} <span class="id">${id}</span></h1><div class="card">`;
 for(const [k,l,t] of S[c].fields){let v=r[k];
  if(t.startsWith('ref:')){const tc=t.slice(4);v=v?`<a class="l" onclick='go({c:"${tc}",id:"${v}"})'>${esc(nm(tc,v))}</a> <span class="id">${v}</span>`:'—'}
  else if(t==='number')v=v!=null&&v!==''?money(v):'—';
  else if(k==='status')v=pill(v);else v=esc(v)||'—';
  h+=`<div class="kv"><span>${l}</span><span>${v}</span></div>`}
 h+='</div>'+extra(c,id,r);
 if(c==='customers'){const inv=sum('invoices',x=>x.customerId===id),pd=sum('invoices',x=>x.customerId===id&&x.status==='Paid'),ex=sum('expenses',x=>D.jobs[x.jobId]?.customerId===id);
  h+=`<h2>Money</h2><div class="card"><div class="kv"><span>Invoiced</span><span>${money(inv)}</span></div><div class="kv"><span>Paid</span><span>${money(pd)}</span></div><div class="kv"><span>Owing</span><span>${money(inv-pd)}</span></div><div class="kv"><span>Expenses</span><span>${money(ex)}</span></div></div>`}
 for(const L of links(c,id).filter(x=>x.oc!=='photos')){h+=`<h2>${S[L.oc].plural} (via ${L.l})</h2>`+L.ids.map(i=>rowHtml(L.oc,i)).join('')+(NOADD[L.oc]?'':`<button onclick='openForm("${L.oc}",null,{${L.k}:"${id}"})'>+ Add ${S[L.oc].label.toLowerCase()}</button>`)}
 h+=`<p style="margin-top:22px;display:flex;gap:8px"><button onclick="openForm('${c}','${id}')">Edit</button><button class="d" onclick="del('${c}','${id}')">Delete</button></p>`;
 a.innerHTML=h}

function openForm(c,id,pre){
 if(c==='quotes'||c==='invoices')return openDoc(c,id,pre);
 if(c==='comms')return openComm(id,pre);
 const r=id?{...D[c][id]}:{...(pre||{})};PRE={...r};let h=`<h1>${id?'Edit':'New'} ${S[c].label.toLowerCase()}</h1>`;
 for(const [k,l,t,hid] of S[c].fields){if(hid)continue;let v=r[k];h+=`<label>${l}</label>`;
  if(t==='area')h+=`<textarea data-k="${k}" rows="3">${esc(v)}</textarea>`;

async function save(c,id){

 if(c==='customers'&&!o.name){alert('Name is required');return}
 const RQ={leads:'customerId',jobs:'quoteId',showcase:'jobId',reviews:'jobId',payments:'invoiceId'}[c];if(RQ&&!o[RQ]){alert('Choose the '+RQ.replace('Id',''));return}
 if(c==='trips'){if(o.odoStart!=null&&o.odoEnd!=null&&o.odoEnd>o.odoStart)o.km=Math.round((o.odoEnd-o.odoStart)*10)/10;if(!(o.km>0)){alert('Enter the odometer start and end, or the distance in km');return}}
 if(c==='visits'){if(!o.leadId&&!o.jobId){alert('Choose a lead or a job');return}o.kind=o.leadId&&!o.jobId?'Quote visit':'Job visit'}
 if(c==='jobs'&&D.quotes[o.quoteId])o.customerId=D.quotes[o.quoteId].customerId;
 if(c==='showcase'&&['Approved','Scheduled','Posted'].includes(o.status)&&o.permission!=='Granted'){alert('Customer permission must be Granted before this can be approved, scheduled or posted.');return}
 const nid=id||nextId(c);try{await db.collection(c).doc(nid).set(o);

  if(c==='visits'){if(o.jobId)await upd('jobs',o.jobId,{});if(o.leadId)await upd('leads',o.leadId,{})}
  if((c==='time'||c==='expenses')&&o.jobId)await upd('jobs',o.jobId,{});
  if(c==='jobs'&&!id&&o.quoteId){const q=D.quotes[o.quoteId];await upd('quotes',o.quoteId,{status:'Accepted'});if(q?.leadId)await upd('leads',q.leadId,{status:'Won'});let n=0;for(const d of q?.proposed||[])await db.collection('visits').doc('V-'+Date.now().toString(36)+(n++)).set({jobId:nid,kind:'Job visit',date:d,time:q.proposedTime||'',status:'Scheduled',note:'',touched:today()});if(n)toast(n+' visit'+(n>1?'s':'')+' scheduled from the quote')}

function showDoc(c,id){PV={c,id};closeM();const s=Math.min(1,(innerWidth-16)/794),p=$('#pvs');p.style.cssText=`width:${794*s}px;height:${1123*s}px;margin:70px auto 24px`;p.innerHTML=`<div style="width:794px;transform:scale(${s});transform-origin:0 0">${docHtml(c,id)}</div>`;$('#pv').style.display='block'}
const closePv=()=>$('#pv').style.display='none';
async function pdfSave(){const {c,id}=PV,r=D[c][id],x=document.createElement('div');x.style.cssText='position:fixed;left:-9999px;top:0';x.innerHTML=docHtml(c,id);document.body.appendChild(x);
 try{const dl=await claude.use('downloads');if(!dl){alert('Saving files isn’t available in this view.');return}
  await Promise.all(['500','700','800'].map(w=>document.fonts.load(w+' 14px Montserrat').catch(()=>0)));
  const cv=await html2canvas(x.firstChild,{scale:2,backgroundColor:'#ffffff'}),pdf=new jspdf.jsPDF({unit:'pt',format:'a4'});
  pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,595.28,841.89);
  await dl.save({filename:[r.number,D.customers[r.customerId]?.name,D.jobs[r.jobId]?.title].filter(Boolean).join(' - ').replace(/[\\/:*?"<>|]/g,'')+'.pdf',data:pdf.output('blob')})}
 catch(e){if(e?.code!=='dismissed')alert('Could not save PDF: '+(e.message||e.code))}finally{x.remove()}}

(async()=>{
 render();
 try{db=window.claude?.use?await claude.use('db'):null}catch(e){db=null}
 if(!db){render();return}
 const t=setTimeout(()=>{if(loaded<COLS.length){loaded=COLS.length;render()}},10000);
 const seen=new Set();
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{D[c]={};s.docs.forEach(d=>D[c][d.id]=d.data());seen.add(c);loaded=seen.size;clearTimeout(t);render()},e=>{console.error(e);seen.add(c);loaded=seen.size;render()}));
})();
